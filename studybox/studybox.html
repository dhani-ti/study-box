<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyBox — Organize Your Study, Simplify Your Life.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1530; --b4:#9b82ff; --b5:#7c5cfc; --b6:#6a47ea; --b7:#5835c7; --b8:#43289a;
  --l50:#faf8ff; --l100:#f3efff; --l200:#e8e0ff; --l300:#d6caff;
  --shadow:0 2px 4px rgba(27,21,48,.03),0 14px 36px -14px rgba(106,71,234,.22);
  --lift:0 4px 8px rgba(27,21,48,.04),0 24px 48px -16px rgba(106,71,234,.30);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background-color:#f7f4ff;background-attachment:fixed;
  background-image:radial-gradient(900px 500px at 8% -5%,rgba(187,169,255,.55),transparent 60%),
    radial-gradient(700px 500px at 100% 10%,rgba(214,202,255,.7),transparent 60%),
    radial-gradient(800px 600px at 60% 110%,rgba(155,130,255,.28),transparent 60%);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{flex-shrink:0}
.app{display:flex;min-height:100vh}
.glass{background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

/* Sidebar */
.side{position:sticky;top:0;height:100vh;width:280px;padding:16px;flex-shrink:0}
.side .glass{height:100%;border-radius:32px;padding:20px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.logo i{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--b4),var(--b7));box-shadow:var(--shadow)}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:24px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:rgba(27,21,48,.6);text-decoration:none;transition:.2s}
.nav a:hover{background:var(--l100);color:var(--b7)}
.nav a.active{background:var(--ink);color:#fff;box-shadow:var(--shadow);view-transition-name:nav-pill}
.me{background:linear-gradient(135deg,var(--l100),rgba(232,224,255,.7));border-radius:24px;padding:12px;display:flex;align-items:center;gap:12px}
.me .t{min-width:0;flex:1}.me b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{font-size:11px;color:rgba(27,21,48,.5)}
.mnav{display:none}
.mhead{display:none}

/* Main */
main{flex:1;min-width:0;padding:32px 40px 48px}
#view{max-width:1120px;margin:0 auto;view-transition-name:page}
.h1{font-size:36px;font-weight:800;letter-spacing:-.025em}
.sub{color:rgba(27,21,48,.55);font-size:14px;margin-top:4px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.fade{animation:fade .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-size:14px;font-weight:700;transition:.15s;background:var(--ink);color:#fff;white-space:nowrap}
.btn:hover{background:#000}.btn:active{transform:scale(.96)}
.btn.sm{height:36px;padding:0 16px;font-size:12px}
.btn.soft{background:var(--l100);color:var(--b7)}.btn.soft:hover{background:var(--l200)}
.btn.ghost{background:rgba(255,255,255,.8);color:var(--ink);border:1px solid var(--l200)}
.btn.danger{background:#f43f5e}.btn.danger:hover{background:#e11d48}
.btn.white{background:rgba(255,255,255,.15);backdrop-filter:blur(8px)}.btn.white:hover{background:rgba(255,255,255,.25)}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:rgba(27,21,48,.5);transition:.15s}
.ib:hover{background:var(--l100);color:var(--b7)}.ib.red:hover{background:#fff1f2;color:#f43f5e}.ib:active{transform:scale(.88)}
.chip{height:40px;padding:0 20px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;border:1px solid var(--l200);background:rgba(255,255,255,.7);color:rgba(27,21,48,.7);display:inline-flex;align-items:center;gap:8px;transition:.15s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:24px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Inputs */
.in{width:100%;border:1px solid var(--l200);background:rgba(255,255,255,.85);border-radius:16px;padding:12px 16px;font-size:14px;outline:0;transition:.15s}
.in:focus{border-color:var(--b5);box-shadow:0 0 0 4px rgba(124,92,252,.15)}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(27,21,48,.5);margin-bottom:6px}
.search{position:relative;margin-bottom:16px}.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:rgba(27,21,48,.35)}
.search .in{border-radius:999px;background:#fff;padding-left:44px}
.field{margin-bottom:16px}

/* Cards / grids */
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(4,1fr)}
.card{border-radius:28px;padding:20px}
.hero{position:relative;overflow:hidden;border-radius:36px;padding:40px;color:#fff;background:linear-gradient(135deg,var(--b5),var(--b6) 50%,var(--b8));box-shadow:var(--lift);margin-bottom:24px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.hero:before{width:288px;height:288px;right:-64px;top:-80px}.hero:after{width:256px;height:256px;right:96px;bottom:-96px;background:rgba(214,202,255,.15)}
.hero>*{position:relative}
.hero h1{font-size:48px;font-weight:800;letter-spacing:-.025em;margin:4px 0}
.hero p{color:rgba(255,255,255,.75)}
.stat{border-radius:28px;padding:20px;text-decoration:none;color:inherit;transition:.2s;display:block;cursor:pointer}
.stat:hover{transform:translateY(-4px);box-shadow:var(--lift)}
.stat .ico{width:48px;height:48px;border-radius:16px;display:grid;place-items:center}
.stat p{margin-top:20px;font-size:14px;font-weight:600;color:rgba(27,21,48,.55)}
.stat b{font-size:40px;font-weight:800;letter-spacing:-.02em;display:block;margin-top:4px}
.two{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;margin-top:24px}
.col{display:flex;flex-direction:column;gap:24px}
.sec{border-radius:32px;padding:24px}
.sec h3{font-size:18px;font-weight:800}
.sech{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sech .ico{width:40px;height:40px;border-radius:16px;display:grid;place-items:center}
.row{display:flex;align-items:center;gap:16px;border-radius:24px;padding:12px;background:rgba(255,255,255,.8);box-shadow:0 0 0 1px var(--l100);margin-bottom:10px}
.date{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;text-align:center;line-height:1;flex-shrink:0;font-weight:800}
.date small{display:block;font-size:10px;text-transform:uppercase;font-weight:700}
.empty{border-radius:24px;background:var(--l50);padding:32px 16px;text-align:center;font-size:14px;color:rgba(27,21,48,.55)}
.es{border-radius:32px;padding:56px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.es .ico{width:64px;height:64px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--l200),var(--l100));color:var(--b6)}
.es h3{font-size:18px;font-weight:800}.es p{max-width:360px;font-size:14px;color:rgba(27,21,48,.55)}
.act{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;transition:.15s}
.act:hover{background:var(--l50)}
.act .ico{width:36px;height:36px;border-radius:50%;background:var(--l100);color:var(--b6);display:grid;place-items:center}
.act p{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.act small{color:rgba(27,21,48,.4);font-size:12px;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;text-align:center}
.cal span{font-size:11px;font-weight:700;text-transform:uppercase;color:rgba(27,21,48,.4);padding-bottom:4px}
.cal div{display:flex;justify-content:center}
.cal i{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:600;color:rgba(27,21,48,.7)}
.cal i.t{background:var(--ink);color:#fff}.cal i.m{background:var(--l200);color:var(--b7)}
.cal i.m:after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--b6)}

/* Notes / subjects / files / tasks */
.note{height:208px;cursor:pointer;display:flex;flex-direction:column;transition:.2s}
.note:hover,.subj:hover{transform:translateY(-4px);box-shadow:var(--lift)}
.note h3{font-size:18px;font-weight:800;margin-top:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note p{flex:1;font-size:14px;color:rgba(27,21,48,.55);margin-top:4px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note p{flex:1;font-size:14px;color:rgba(27,21,48,.55);margin-top:4px;white-space:pre-line;display:-webkit-box;line-clamp:3;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note small{font-size:12px;color:rgba(27,21,48,.4);font-weight:500}
.note .ib{opacity:0}.note:hover .ib{opacity:1}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:rgba(255,255,255,.85);box-shadow:0 0 0 1px var(--l200);padding:4px 10px;font-size:11px;font-weight:700;color:rgba(27,21,48,.7)}
.top{display:flex;justify-content:space-between;align-items:flex-start;min-height:28px}
.subj{border-radius:28px;padding:20px;cursor:pointer;transition:.2s}
.subj .av{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:800;box-shadow:var(--shadow)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--l100);padding:6px 12px;font-size:12px;font-weight:700;color:rgba(27,21,48,.6)}
.file{display:flex;align-items:center;gap:16px;border-radius:28px;padding:16px;margin-bottom:12px}
.file .fi{width:56px;height:56px;border-radius:16px;background:#fff1f2;color:#f43f5e;display:grid;place-items:center;flex-shrink:0}
.file .mid{flex:1;min-width:0}.file b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12px;color:rgba(27,21,48,.5);margin-top:4px}
.drop{display:flex;align-items:center;gap:16px;border:2px dashed var(--l300);background:rgba(255,255,255,.5);border-radius:32px;padding:24px;margin-bottom:24px;transition:.2s;flex-wrap:wrap}
.drop.over{border-color:var(--b5);background:rgba(232,224,255,.7)}
.drop .ico{width:56px;height:56px;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--b4),var(--b7));box-shadow:var(--shadow)}
.task{display:flex;align-items:flex-start;gap:16px;border-radius:28px;padding:16px;margin-bottom:12px}
.task.done{opacity:.65}.task.done b{text-decoration:line-through;text-decoration-color:rgba(27,21,48,.3)}
.cb{width:32px;height:32px;border-radius:50%;border:2px solid var(--l300);background:#fff;display:grid;place-items:center;color:transparent;flex-shrink:0;transition:.15s;margin-top:2px}
.cb:hover{border-color:var(--b5)}.task.done .cb{background:var(--b6);border-color:var(--b6);color:#fff}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;background:var(--l100);color:var(--b7)}
.tag.warn{background:#fef3c7;color:#b45309}.tag.late{background:#ffe4e6;color:#e11d48}
.tc{display:inline-block;margin-left:6px;border-radius:999px;padding:1px 8px;font-size:11px;background:var(--l100);color:var(--b7)}.chip.on .tc{background:rgba(255,255,255,.2);color:#fff}
.colors{display:flex;flex-wrap:wrap;gap:12px}.colors button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}
.colors button.on{box-shadow:0 0 0 4px rgba(124,92,252,.25)}

/* Avatar flower */
.flower{position:relative;flex-shrink:0}.flower svg{position:absolute;inset:0;width:100%;height:100%}.flower b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800}

/* Modal */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.ov .bg{position:absolute;inset:0;background:rgba(27,21,48,.4);backdrop-filter:blur(4px);animation:fade .2s both}
.md{position:relative;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;background:#fff;border-radius:32px;box-shadow:var(--lift);animation:pop .25s cubic-bezier(.2,.8,.2,1) both}
.md.lg{max-width:900px}.md.xl{max-width:1100px}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}}
.md .hd{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px 32px 8px}
.md .hd h2{font-size:20px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md .bd{padding:8px 32px 24px;overflow-y:auto;min-height:0;flex:1}
.md .ft{display:flex;justify-content:flex-end;gap:8px;padding:16px 32px;border-top:1px solid var(--l100)}
.ti{width:100%;border:0;outline:0;background:none;font-size:30px;font-weight:800;letter-spacing:-.02em;margin:8px 0 12px}
.ta{width:100%;min-height:45vh;resize:none;border:0;outline:0;background:var(--l50);border-radius:24px;padding:20px;font-size:15px;line-height:1.6}
.ta:focus{box-shadow:0 0 0 4px rgba(124,92,252,.15)}
.st{font-size:12px;font-weight:700}
.cf{text-align:center;padding:16px 0}.cf .ico{width:56px;height:56px;border-radius:50%;background:#fff1f2;color:#f43f5e;display:grid;place-items:center;margin:0 auto 12px}
.cf h3{font-size:18px;font-weight:800;margin-bottom:8px}.cf p{font-size:14px;color:rgba(27,21,48,.6)}
iframe{width:100%;height:68vh;border:1px solid var(--l200);border-radius:24px;background:var(--l50)}

/* Toast */
#toasts{position:fixed;top:16px;right:24px;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:12px;align-items:center;min-width:240px;max-width:360px;background:rgba(255,255,255,.95);border:1px solid #fff;border-radius:20px;padding:14px 16px;box-shadow:var(--lift);font-size:14px;font-weight:600;animation:pop .25s both}
.toast.success svg{color:#10b981}.toast.error svg{color:#f43f5e}.toast.info svg{color:var(--b5)}
.banner{border-radius:20px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:13px;padding:12px 16px;margin-bottom:20px;display:flex;gap:10px;align-items:flex-start}

/* View transitions (morph) */
::view-transition-old(root),::view-transition-new(root){animation-duration:.01s}
::view-transition-group(page){animation-duration:.45s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(page){animation:vo .22s ease both}
::view-transition-new(page){animation:vi .45s cubic-bezier(.2,.8,.2,1) both}
::view-transition-group(nav-pill),::view-transition-group(nav-pill-m){animation-duration:.45s;animation-timing-function:cubic-bezier(.34,1.3,.5,1)}
@keyframes vo{to{opacity:0;transform:translateY(-8px)}}
@keyframes vi{from{opacity:0;transform:translateY(14px)}}
.skeleton{background:var(--l200);border-radius:20px;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.5}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

/* Tablet */
@media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.side{width:96px}.side .logo span,.nav a span,.me .t{display:none}.nav a{justify-content:center;padding:0}.me{justify-content:center;flex-direction:column}}
/* Mobile */
@media(max-width:767px){
  .side{display:none}
  main{padding:16px 20px 120px}
  .mhead{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 0}
  .mnav{display:flex;position:fixed;left:16px;right:16px;bottom:16px;z-index:40;justify-content:space-between;background:var(--ink);padding:8px;border-radius:999px;box-shadow:var(--lift)}
  .mnav a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.6)}
  .mnav a.active{background:#fff;color:var(--ink);view-transition-name:nav-pill-m}
  .h1{font-size:28px}.hero{padding:28px}.hero h1{font-size:36px}
  .md{border-radius:32px 32px 0 0;max-width:none}.ov{align-items:flex-end;padding:0}
  .md .hd,.md .bd,.md .ft{padding-left:20px;padding-right:20px}
  .note .ib{opacity:1}#toasts{left:16px;right:16px;align-items:stretch}.toast{max-width:none}
  .g3{grid-template-columns:1fr}.file{flex-wrap:wrap}.file .acts{margin-left:auto}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="glass">
    <div class="logo"><i id="lg"></i><span>StudyBox</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="me" id="me"></div>
  </div></aside>
  <div style="flex:1;min-width:0">
    <div class="mhead"><div class="logo"><i id="lg2"></i><span>StudyBox</span></div><div id="meM"></div></div>
    <main><div id="view"></div></main>
  </div>
  <nav class="mnav" id="mnav"></nav>
</div>
<div id="toasts"></div>
<div id="modals"></div>

<script>
/* ============ Util ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const P={
 dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
 notes:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
 file:'<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5Z"/><path d="M14 2v6h6"/>',
 lib:'<path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/>',
 tasks:'<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
 set:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
 plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
 trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
 edit:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
 eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
 dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',

const daysUntil=s=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((pdate(s)-t)/864e5)};

const ago=t=>{const s=(Date.now()-t)/1000;return s<60?'Baru saja':s<3600?Math.floor(s/60)+' menit lalu':s<86400?Math.floor(s/3600)+' jam lalu':s<604800?Math.floor(s/86400)+' hari lalu':fdate(new Date(t).toISOString())};
const bytes=n=>{const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(n>=10||i===0?0:1)+' '+u[i]};

}
function flower(name,size){
  const l=(name||'U').trim()[0].toUpperCase();
  const petals=Array.from({length:8},(_,i)=>{const a=i*Math.PI/4;return `<circle cx="${50+27*Math.cos(a)}" cy="${50+27*Math.sin(a)}" r="19" fill="url(#fg)"/>`}).join('');
  return `<div class="flower" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100"><defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bba9ff"/><stop offset="1" stop-color="#6a47ea"/></linearGradient></defs>${petals}<circle cx="50" cy="50" r="30" fill="url(#fg)"/></svg><b style="font-size:${size*.38}px">${esc(l)}</b></div>`;
}
let modalStack=[];
function modal({title,body,footer,size='',onClose}){
  const id=uid(),el=document.createElement('div');el.className='ov';el.dataset.id=id;
  el.innerHTML=`<div class="bg"></div><div class="md ${size}" role="dialog" aria-modal="true">${title?`<div class="hd"><h2>${esc(title)}</h2><button class="ib" data-close aria-label="Tutup">${ic('x')}</button></div>`:''}<div class="bd">${body}</div>${footer?`<div class="ft">${footer}</div>`:''}</div>`;
  const close=async()=>{if(onClose&&(await onClose())===false)return;el.remove();modalStack=modalStack.filter(m=>m.id!==id);document.body.style.overflow=modalStack.length?'hidden':''};
  el.querySelector('.bg').onclick=close;el.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  $('#modals').appendChild(el);document.body.style.overflow='hidden';
  modalStack.push({id,close,el});return {el,close};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalStack.length)modalStack[modalStack.length-1].close()});
function confirmBox(title,message,onYes){
  const m=modal({body:`<div class="cf"><div class="ico">${ic('alert',28)}</div><h3>${esc(title)}</h3><p>${esc(message)}</p></div>`,
    footer:`<button class="btn ghost" data-close>Batal</button><button class="btn danger" id="yes">Hapus</button>`});
  m.el.querySelector('#yes').onclick=async()=>{await onYes();m.close()};
}

function openNote(id){

  const st=$('#nst'),setSt=(t,c)=>{st.style.color=c;st.innerHTML=t};
  function flush(){if(!dirty)return;dirty=false;n.title=$('#nt').value.trim()||'Tanpa judul';n.content=$('#nc').value;n.subject_id=$('#ns').value||null;n.updated=Date.now();save();setSt(ic('check',14)+' Tersimpan','#059669')}

}

  $('#fq').oninput=e=>{fQ=e.target.value;$('#flist').innerHTML=fileListHTML()};
  $('#upS').onchange=e=>upSubj=e.target.value;
  $('#fi').onchange=e=>upload(e.target.files);
  const d=$('#drop');d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('over');upload(e.dataTransfer.files)};
};
async function upload(list){
  let ok=0;
  for(const f of Array.from(list||[])){
    if(!(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'))){toast(`"${f.name}" bukan file PDF.`,'error');continue}
    if(f.size>25*1024*1024){toast(`"${f.name}" melebihi batas 25 MB.`,'error');continue}
    const id=uid();
    try{await idbOp('readwrite',s=>s.put(f,id))}catch(e){toast(`Gagal menyimpan "${f.name}".`,'error');continue}
    S.files.unshift({id,name:f.name,size:f.size,created:new Date().toISOString(),subject_id:upSubj||null});
    log('file',`Mengunggah PDF "${f.name}"`);ok++;
  }
  save();if(ok)toast(ok===1?'PDF berhasil diunggah.':`${ok} PDF berhasil diunggah.`);rerender();
}
async function getBlob(id){return idbOp('readonly',s=>s.get(id))}
async function dlFile(id){const f=S.files.find(x=>x.id===id),b=await getBlob(id);if(!b)return toast('File tidak ditemukan.','error');const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Unduhan dimulai.','info')}
async function prevFile(id){
  const f=S.files.find(x=>x.id===id),b=await getBlob(id);if(!b)return toast('File tidak ditemukan.','error');
  const u=URL.createObjectURL(b);
  modal({title:f.name,size:'xl',onClose:()=>{URL.revokeObjectURL(u)},body:`<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><button class="btn soft sm" id="pd">${ic('dl',16)} Download</button><a class="btn soft sm" href="${u}" target="_blank" rel="noreferrer" style="text-decoration:none">${ic('ext',16)} Buka di tab baru</a></div><iframe src="${u}" title="${esc(f.name)}"></iframe>`});
  $('#pd').onclick=()=>dlFile(id);
}
function editFile(id){
  const f=S.files.find(x=>x.id===id);
  const m=modal({title:'Ubah file',body:`<div class="field" style="padding-top:8px"><label class="lbl">Nama file</label><input class="in" id="efn" value="${esc(f.name)}"></div><div class="field"><label class="lbl">Subject</label><select class="in" id="efs">${subjOptions(f.subject_id)}</select></div>`,footer:`<button class="btn ghost" data-close>Batal</button><button class="btn" id="efsave">Simpan</button>`});
  $('#efsave').onclick=()=>{const n=$('#efn').value.trim();if(!n)return toast('Nama file tidak boleh kosong.','error');f.name=n;f.subject_id=$('#efs').value||null;save();m.close();toast('File diperbarui.');rerender()};
}

/* ============ Subjects ============ */
function pSubjects(){
  const cnt=id=>({n:S.notes.filter(x=>x.subject_id===id).length,f:S.files.filter(x=>x.subject_id===id).length,t:S.tasks.filter(x=>x.subject_id===id).length});
  return header('Subjects','Kelompokkan catatan, PDF, dan tugas berdasarkan mata pelajaran.',`<button class="btn" data-a="newSubj">${ic('plus')} Tambah subject</button>`)+
  (S.subjects.length?`<div class="grid g3">${S.subjects.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>{const c=cnt(s.id);return `<article class="glass subj fade" data-a="viewSubj" data-id="${s.id}"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="av" style="background:${s.color}">${esc(s.name[0].toUpperCase())}</div><div><button class="ib" data-a="editSubj" data-id="${s.id}" aria-label="Ubah subject">${ic('edit')}</button><button class="ib red" data-a="delSubj" data-id="${s.id}" aria-label="Hapus subject">${ic('trash')}</button></div></div><h3 style="font-size:20px;font-weight:800;margin-top:16px">${esc(s.name)}</h3><div class="pills"><span class="pill">${ic('notes',14)} ${c.n} catatan</span><span class="pill">${ic('file',14)} ${c.f} PDF</span><span class="pill">${ic('tasks',14)} ${c.t} tugas</span></div></article>`}).join('')}</div>`
   :empty('lib','Belum ada subject','Buat subject seperti Matematika atau Biologi, lalu hubungkan catatan dan PDF ke dalamnya.',`<button class="btn" data-a="newSubj">${ic('plus')} Buat subject pertama</button>`));
}
function subjForm(id){
  const s=id?subj(id):null;let color=s?s.color:COLORS[0];
  const m=modal({title:s?'Ubah subject':'Subject baru',body:`<div class="field" style="padding-top:8px"><label class="lbl">Nama subject</label><input class="in" id="sn" maxlength="40" placeholder="Contoh: Matematika" value="${s?esc(s.name):''}"></div><label class="lbl">Warna</label><div class="colors" id="sc"></div>`,footer:`<button class="btn ghost" data-close>Batal</button><button class="btn" id="ssave">${s?'Simpan':'Tambah'}</button>`});
  const paint=()=>{$('#sc').innerHTML=COLORS.map(c=>`<button type="button" class="${c===color?'on':''}" data-c="${c}" style="background:${c}" aria-label="Warna ${c}">${c===color?ic('check',16):''}</button>`).join('');$('#sc').querySelectorAll('button').forEach(b=>b.onclick=()=>{color=b.dataset.c;paint()})};paint();
  const submit=()=>{const name=$('#sn').value.trim();if(!name)return toast('Nama subject tidak boleh kosong.','error');
    if(S.subjects.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()))return toast('Subject dengan nama ini sudah ada.','error');
    if(s){s.name=name;s.color=color;toast('Subject diperbarui.')}else{S.subjects.push({id:uid(),name,color});log('subject',`Menambah subject "${name}"`);toast('Subject ditambahkan.')}
    save();m.close();rerender()};
  $('#ssave').onclick=submit;$('#sn').onkeydown=e=>e.key==='Enter'&&submit();$('#sn').focus();
}
function viewSubj(id){
  const s=subj(id);
  const sec=(label,ico,items)=>`<h4 style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin:16px 0 8px;color:var(--ink)"><span style="color:var(--b6)">${ic(ico,16)}</span>${label}<span class="tc">${items.length}</span></h4>`+(items.length?items.map(x=>`<div style="background:var(--l50);border-radius:16px;padding:10px 16px;font-size:14px;font-weight:600;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x)}</div>`).join(''):`<div style="background:var(--l50);border-radius:16px;padding:12px 16px;font-size:14px;color:rgba(27,21,48,.5)">Belum ada.</div>`);
  modal({title:s.name,size:'lg',body:sec('Catatan','notes',S.notes.filter(x=>x.subject_id===id).map(x=>x.title))+sec('File PDF','file',S.files.filter(x=>x.subject_id===id).map(x=>x.name))+sec('Tugas','tasks',S.tasks.filter(x=>x.subject_id===id).map(x=>x.title+(x.status==='completed'?' ✓':'')))});
}

/* ============ Tasks ============ */
let tF='all';
function pTasks(){
  const c={all:S.tasks.length,pending:S.tasks.filter(t=>t.status==='pending').length,completed:S.tasks.filter(t=>t.status==='completed').length};
  const list=S.tasks.filter(t=>tF==='all'||t.status===tF).sort((a,b)=>a.status!==b.status?(a.status==='pending'?-1:1):a.deadline&&b.deadline?a.deadline.localeCompare(b.deadline):a.deadline?-1:b.deadline?1:0);
  return header('My Tasks','Catat tugas dan pantau deadline-nya.',`<button class="btn" data-a="newTask">${ic('plus')} Tambah tugas</button>`)+
  `<div class="chips">${[['all','Semua'],['pending','Pending'],['completed','Completed']].map(([k,l])=>`<button class="chip ${tF===k?'on':''}" data-a="tf" data-v="${k}">${l}<span class="tc">${c[k]}</span></button>`).join('')}</div>`+
  (!S.tasks.length?empty('tasks','Belum ada tugas','Tambahkan tugas pertamamu supaya deadline tidak terlewat.',`<button class="btn" data-a="newTask">${ic('plus')} Tambah tugas</button>`)
  :!list.length?empty('tasks',tF==='pending'?'Semua tugas selesai!':'Belum ada tugas selesai',tF==='pending'?'Tidak ada tugas pending. Waktunya istirahat sejenak.':'Selesaikan tugas dan tandai di sini.')
  :list.map(t=>{const done=t.status==='completed',d=t.deadline?daysUntil(t.deadline):null;
    return `<div class="glass task fade ${done?'done':''}"><button class="cb" data-a="toggle" data-id="${t.id}" aria-label="${done?'Tandai pending':'Tandai selesai'}">${ic('check',16)}</button><div style="flex:1;min-width:0"><b>${esc(t.title)}</b>${t.description?`<p class="sub" style="white-space:pre-line">${esc(t.description)}</p>`:''}<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center">${t.deadline?`<span class="tag ${done?'':d<0?'late':d<=2?'warn':''}">${ic('cal',14)}${fdate(t.deadline)}${done?'':` · ${dlabel(t.deadline)}`}</span>`:''}${badge(t.subject_id)}</div></div><div style="display:flex"><button class="ib" data-a="editTask" data-id="${t.id}" aria-label="Ubah tugas">${ic('edit')}</button><button class="ib red" data-a="delTask" data-id="${t.id}" aria-label="Hapus tugas">${ic('trash')}</button></div></div>`}).join(''));
}
function taskForm(id){
  const t=id?S.tasks.find(x=>x.id===id):null;let status=t?t.status:'pending';
  const m=modal({title:t?'Ubah tugas':'Tugas baru',body:`<div class="field" style="padding-top:8px"><label class="lbl">Judul</label><input class="in" id="tt" placeholder="Contoh: Kerjakan laporan praktikum" value="${t?esc(t.title):''}"></div>
   <div class="field"><label class="lbl">Deskripsi</label><textarea class="in" id="td" style="min-height:96px;resize:none" placeholder="Detail tugas (opsional)">${t?esc(t.description):''}</textarea></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="field"><div><label class="lbl">Deadline</label><input type="date" class="in" id="tdl" value="${t&&t.deadline?t.deadline:''}"></div><div><label class="lbl">Subject</label><select class="in" id="ts">${subjOptions(t&&t.subject_id)}</select></div></div>
   <label class="lbl">Status</label><div style="display:flex;gap:8px" id="tst"></div>`,footer:`<button class="btn ghost" data-close>Batal</button><button class="btn" id="tsave">${t?'Simpan':'Tambah'}</button>`});
  const paint=()=>{$('#tst').innerHTML=['pending','completed'].map(s=>`<button type="button" class="chip ${status===s?'on':''}" data-s="${s}">${s==='pending'?'Pending':'Completed'}</button>`).join('');$('#tst').querySelectorAll('button').forEach(b=>b.onclick=()=>{status=b.dataset.s;paint()})};paint();
  $('#tsave').onclick=()=>{const title=$('#tt').value.trim();if(!title)return toast('Judul tugas tidak boleh kosong.','error');
    const data={title,description:$('#td').value.trim(),deadline:$('#tdl').value||null,subject_id:$('#ts').value||null,status};
    if(t){Object.assign(t,data);toast('Tugas diperbarui.')}else{S.tasks.unshift({id:uid(),...data});log('task',`Menambah tugas "${title}"`);toast('Tugas ditambahkan.')}
    save();m.close();rerender()};
  $('#tt').focus();
}

/* ============ Settings ============ */
function pSettings(){
  const total=S.files.reduce((a,f)=>a+f.size,0);
  return header('Settings','Kelola profil dan data pratinjau.')+
  `<div class="banner">${ic('info',18)}<span><b>Mode pratinjau.</b> Data disimpan hanya di browser ini (localStorage &amp; IndexedDB), tanpa login dan tanpa server. Versi lengkap dengan Supabase ada di proyek Next.js.</span></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
  <section class="glass sec"><div style="display:flex;align-items:center;gap:16px">${flower(S.user,64)}<div><h3 style="font-size:20px">${esc(S.user)}</h3></div></div>
    <div class="field" style="margin-top:24px"><label class="lbl">Nama tampilan</label><input class="in" id="sname" value="${esc(S.user)}"></div><button class="btn" data-a="saveName">Simpan profil</button></section>
  <section class="glass sec"><div class="sech"><div class="ico" style="background:var(--l200);color:var(--b7)">${ic('file',20)}</div><h3>Penyimpanan</h3></div><b style="font-size:40px;font-weight:800;letter-spacing:-.02em">${bytes(total)}</b><p class="sub">dipakai oleh ${S.files.length} file PDF</p></section>
  <section class="glass sec"><h3>Reset data</h3><p class="sub" style="margin:8px 0 24px">Hapus semua data pratinjau dan kembali ke contoh awal.</p><button class="btn danger" data-a="reset">Reset data</button></section>
  </div>`;
}

/* ============ Event delegation ============ */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g&&!e.target.closest('[data-a]')){e.preventDefault();return go(g.dataset.go)}
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,id=el.dataset.id,v=el.dataset.v;
  if(el.closest('button[data-a]')&&el.tagName!=='BUTTON'){}
  const stop=()=>e.stopPropagation();
  const H={
    calPrev:()=>{calCur=new Date(calCur.getFullYear(),calCur.getMonth()-1,1);rerender()},
    calNext:()=>{calCur=new Date(calCur.getFullYear(),calCur.getMonth()+1,1);rerender()},
    newNote:()=>{const n={id:uid(),title:'Catatan baru',content:'',subject_id:(nF!=='all'&&nF!=='none')?nF:null,updated:Date.now()};S.notes.unshift(n);log('note','Membuat catatan baru');save();rerender();openNote(n.id)},
    openNote:()=>openNote(id),
    delNote:()=>{stop();const n=S.notes.find(x=>x.id===id);confirmBox('Hapus catatan ini?',`"${n.title}" akan dihapus permanen dan tidak bisa dikembalikan.`,()=>{S.notes=S.notes.filter(x=>x.id!==id);log('note',`Menghapus catatan "${n.title}"`);save();toast('Catatan dihapus.');rerender()})},
    nf:()=>{nF=v;rerender()},
    ff:()=>{fF=v;rerender()},
    pick:()=>$('#fi').click(),
    prevFile:()=>prevFile(id),dlFile:()=>dlFile(id),editFile:()=>editFile(id),
    delFile:()=>{const f=S.files.find(x=>x.id===id);confirmBox('Hapus file ini?',`"${f.name}" akan dihapus permanen dari penyimpanan.`,async()=>{await idbOp('readwrite',s=>s.delete(id));S.files=S.files.filter(x=>x.id!==id);log('file',`Menghapus PDF "${f.name}"`);save();toast('File dihapus.');rerender()})},
    newSubj:()=>subjForm(),editSubj:()=>{stop();subjForm(id)},viewSubj:()=>viewSubj(id),
    delSubj:()=>{stop();const s=subj(id);confirmBox('Hapus subject ini?',`Subject "${s.name}" akan dihapus. Catatan, PDF, dan tugas di dalamnya tidak ikut terhapus, hanya menjadi "Tanpa subject".`,()=>{S.subjects=S.subjects.filter(x=>x.id!==id);[...S.notes,...S.files,...S.tasks].forEach(x=>{if(x.subject_id===id)x.subject_id=null});log('subject',`Menghapus subject "${s.name}"`);save();toast('Subject dihapus.');rerender()})},
    tf:()=>{tF=v;rerender()},
    newTask:()=>taskForm(),editTask:()=>taskForm(id),
    toggle:()=>{const t=S.tasks.find(x=>x.id===id);t.status=t.status==='completed'?'pending':'completed';if(t.status==='completed'){log('task',`Menyelesaikan tugas "${t.title}"`);toast('Hebat! Tugas selesai 🎉')}save();rerender()},
    delTask:()=>{const t=S.tasks.find(x=>x.id===id);confirmBox('Hapus tugas ini?',`"${t.title}" akan dihapus permanen.`,()=>{S.tasks=S.tasks.filter(x=>x.id!==id);log('task',`Menghapus tugas "${t.title}"`);save();toast('Tugas dihapus.');rerender()})},
    saveName:()=>{const n=$('#sname').value.trim();if(!n)return toast('Nama tidak boleh kosong.','error');S.user=n;save();toast('Profil diperbarui.');rerender()},
    reset:()=>confirmBox('Reset semua data?','Semua catatan, tugas, subject, dan PDF di browser ini akan dihapus.',async()=>{await idbOp('readwrite',s=>s.clear());localStorage.removeItem('studybox');S=seed();save();toast('Data direset.','info');rerender()})
  };
  H[a]&&H[a]();
});

if(!localStorage.getItem('studybox'))save();
render();
</script>
</body>
</html>
